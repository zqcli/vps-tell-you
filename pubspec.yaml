name: vps_tell_you
description: "Local-first personal VPS ledger for iOS and Android."
publish_to: 'none'

version: 0.6.0+6

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  sqflite: 2.4.4+1
  sqflite_common_ffi: 2.4.3
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  local_auth_android: 2.2.0
  local_auth_darwin: 2.0.4
  dartssh2: 4.1.0
  crypto: 3.0.7
  file_selector: 1.1.0
  xterm: 4.0.0
  timezone: 0.11.1
  share_plus: 13.3.1
  http: 1.6.0
  xml: 6.6.1
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # integration_test is deliberately NOT listed: Flutter 3.47 still links
  # dev-dependency plugins into iOS/macOS release builds (flutter#163874).
  # tool/make_screenshots.py adds it temporarily for `flutter drive` and
  # restores this file and pubspec.lock afterwards (docs/SCREENSHOTS.md).
  flutter_lints: 6.0.0
  path_provider_platform_interface: 2.1.3

# sqlite3 (pulled in by sqflite_common_ffi, which only serves the Linux/Windows
# desktop adapter and the tests) must not bundle its own native library: on
# iOS/Android the app uses the platform sqflite plugin, and the bundled iOS
# sqlite3.framework imports statfs/stat with no privacy manifest (App Store
# required-reason APIs). `system` makes the hook ship nothing and lets the FFI
# adapter dlopen the OS copy (libsqlite3.so on Linux, libsqlite3.dylib on
# macOS test hosts). See docs/DEVELOPMENT.md.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE-DejaVu.txt
    - LICENSE
    - CHANGELOG.md
    - CHANGELOG.en.md
    - PRIVACY.md
    - PRIVACY.en.md
  fonts:
    - family: TerminalDejaVu
      fonts:
        - asset: assets/fonts/DejaVuSansMono.ttf
        - asset: assets/fonts/DejaVuSansMono-Bold.ttf
          weight: 700
