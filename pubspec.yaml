publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.6"

dependencies:
  flutter:
    sdk: flutter
  sqflite: 2.4.4+1
  sqflite_common_ffi: 2.4.3
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  local_auth: 3.0.2
  dartssh2: 4.1.0
  crypto: 3.0.7
  file_selector: 1.1.0
  xterm: 4.0.0
  timezone: 0.11.1
  share_plus: 13.3.1
  http: 1.6.0
  xml: 6.6.1
  flutter_local_notifications: 22.3.1
  flutter_timezone: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  path_provider_platform_interface: 2.1.3

flutter:
  uses-material-design: true
